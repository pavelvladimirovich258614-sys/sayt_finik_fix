# /etc/nginx/sites-available/finikfix — временный режим: доступ по IP, только HTTP.
# После подключения домена замените этот файл на deploy/nginx.conf и выпустите сертификат (см. deploy/VPS.md).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain application/json;

    client_max_body_size 16k;

    # Временный адрес не должен попасть в поисковики.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ВРЕМЕННО: приём заявок по открытому HTTP отключён (персональные данные).
    # Приложение и обработчик не тронуты. Удалить этот location после включения HTTPS.
    location = /api/lead {
        default_type application/json;
        charset utf-8;
        return 503 '{"ok":false,"error":"Приём заявок временно отключён. Позвоните или напишите в мессенджер."}';
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
