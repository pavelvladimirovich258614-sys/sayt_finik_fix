# /etc/nginx/sites-available/finikfix — конфиг для домена finikfix.ru (HTTPS).
# Порядок: DNS -> этот файл вместо nginx-ip.conf -> `certbot --nginx -d finikfix.ru -d www.finikfix.ru`.
# Блока `location = /api/lead { return 503 ... }` здесь нет: приём заявок включается вместе с HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name finikfix.ru www.finikfix.ru;
    server_tokens off;
    # certbot сам добавит редирект на HTTPS и listen 443 ssl

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain application/json;

    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Админка: загрузка фото до 32 МБ. Приложение пускает /admin только если X-Forwarded-Proto = https
    # и в .env задано ADMIN_ENABLED=1. Дополнительно ограничьте доступ по IP, если у мастера статический адрес.
    location ^~ /admin/api/ {
        client_max_body_size 32m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
