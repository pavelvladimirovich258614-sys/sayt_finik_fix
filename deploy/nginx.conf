# /etc/nginx/sites-available/finikfix  ([Уточнить: домен] — замените finikfix.ru)
server {
    listen 80;
    server_name finikfix.ru www.finikfix.ru;
    # после выпуска сертификата (certbot --nginx) certbot сам добавит редирект на HTTPS

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;

    location /assets/ { proxy_pass http://127.0.0.1:3000; expires 7d; }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    client_max_body_size 16k;
}
