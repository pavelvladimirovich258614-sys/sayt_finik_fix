name: Server Ops FinikFix

# Контролируемое обслуживание сервера через уже настроенный SSH-доступ (секреты FINIKFIX_SSH_KEY, FINIKFIX_KNOWN_HOSTS).
# Запуск: Actions -> Server Ops FinikFix -> Run workflow, либо push в ветку ops/<операция> (например ops/probe).
# Допустимы только операции из белого списка ниже; каждая либо читает состояние от пользователя deploy, либо вызывает
# /usr/local/sbin/finikfix-ops (его ставит root один раз, deploy его изменить не может). Произвольных команд нет.
on:
  push:
    branches: ['ops/*']
  workflow_dispatch:
    inputs:
      op:
        description: "Операция"
        type: choice
        options: [probe, net, max-tls, logs, status, backup, max-check, max-discover, max-setup, max-test, max-discover-vps, enable-reviews, enable-leads, test-lead, enable-admin, clear-telegram, verify]
        default: probe

permissions:
  contents: read

concurrency:
  group: finikfix-ops
  cancel-in-progress: false

env:
  FINIKFIX_HOST: 194.34.239.218
  FINIKFIX_USER: deploy
  SITE: https://finikfix.ru

jobs:
  ops:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Операция и ограничения
        id: op
        run: |
          set -euo pipefail
          OP="${{ inputs.op }}"; [ -n "$OP" ] || OP="${GITHUB_REF_NAME#ops/}"
          case "$OP" in probe|net|max-tls|logs|status|backup|max-check|max-discover|max-setup|max-test|max-discover-vps|enable-reviews|enable-leads|test-lead|enable-admin|clear-telegram|verify) ;; *) echo "::error::Операция '$OP' не разрешена"; exit 1;; esac
          git fetch -q origin claude/epic-hypatia-mxxztu
          git merge-base --is-ancestor "$GITHUB_SHA" origin/claude/epic-hypatia-mxxztu || { echo "::error::Коммит не входит в рабочую ветку"; exit 1; }
          echo "op=$OP" >> "$GITHUB_OUTPUT"; echo "Операция: $OP"

      - name: Цепочка TLS MAX (раннер GitHub и официальные корневые сертификаты)
        if: ${{ steps.op.outputs.op == 'max-tls' }}
        run: |
          set -uo pipefail
          H=platform-api2.max.ru; D=$(mktemp -d); cd "$D"
          echo "== цепочка, которую предъявляет $H"
          echo | openssl s_client -connect $H:443 -servername $H -showcerts 2>/dev/null > chain.txt
          awk '/BEGIN CERTIFICATE/{n++} n{print > ("c" n ".pem")} /END CERTIFICATE/{}' chain.txt
          for f in c*.pem; do echo "-- $f"; openssl x509 -in $f -noout -subject -issuer -dates -fingerprint -sha256 2>&1; done
          echo "== проверка без доверенного корня: $(echo | openssl s_client -connect $H:443 -servername $H 2>&1 | grep 'Verify return code')"
          for u in russian_trusted_root_ca_pem.crt russian_trusted_sub_ca_2024_pem.crt; do
            echo "== официальный файл $u (gu-st.ru)"
            curl -sS -m 20 -o $u "https://gu-st.ru/content/lending/$u" && openssl x509 -in $u -noout -subject -issuer -dates -fingerprint -sha256 2>&1
          done
          if [ -s russian_trusted_root_ca_pem.crt ]; then cat russian_trusted_root_ca_pem.crt russian_trusted_sub_ca_2024_pem.crt > bundle.pem 2>/dev/null
            echo "== проверка с корнем Минцифры: $(echo | openssl s_client -connect $H:443 -servername $H -CAfile bundle.pem 2>&1 | grep 'Verify return code')"
            echo "== Node с NODE_EXTRA_CA_CERTS: $(NODE_EXTRA_CA_CERTS=$D/bundle.pem node -e 'fetch("https://platform-api2.max.ru/me").then(r=>console.log("HTTP",r.status)).catch(e=>console.log("ошибка",e.cause&&e.cause.code))')"
          fi

      - uses: actions/setup-node@v4
        if: ${{ steps.op.outputs.op == 'max-check' || steps.op.outputs.op == 'max-discover' }}
        with:
          node-version: 22

      - name: MAX с раннера GitHub (проверка токена и поиск получателей)
        if: ${{ steps.op.outputs.op == 'max-check' || steps.op.outputs.op == 'max-discover' }}
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
        run: |
          set -uo pipefail
          [ -n "$MAX_BOT_TOKEN" ] || { echo "::error::Не задан секрет MAX_BOT_TOKEN"; exit 1; }
          case "${{ steps.op.outputs.op }}" in max-check) node scripts/max-tool.mjs me ;; max-discover) node scripts/max-tool.mjs discover ;; esac

      - name: SSH
        env:
          SSH_KEY: ${{ secrets.FINIKFIX_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.FINIKFIX_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/finikfix_key; chmod 600 ~/.ssh/finikfix_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host finikfix\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/finikfix_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n  ServerAliveInterval 15\n' "$FINIKFIX_HOST" "$FINIKFIX_USER" > ~/.ssh/config

      - name: Выполнение
        env:
          OP: ${{ steps.op.outputs.op }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_RECIPIENT_USER_IDS: ${{ secrets.MAX_RECIPIENT_USER_IDS }}
        run: |
          set -uo pipefail
          H=/usr/local/sbin/finikfix-ops
          ops() { ssh -T finikfix "sudo -n $H $*"; }
          have_helper() { ssh -T finikfix "test -x $H && sudo -n -l $H >/dev/null 2>&1"; }
          need_helper() { have_helper || { echo "::error::Помощник $H не установлен на сервере. Один раз от root: bash deploy/install-ops-helper.sh (см. docs/LEADS.md)"; exit 3; }; }
          post() { curl -s -m 20 -w '\nHTTP %{http_code}\n' -X POST -H 'Content-Type: application/json' -H "Origin: $SITE" -d "$2" "$SITE$1"; }
          case "$OP" in
            probe)
              ssh -T finikfix 'bash -s' <<'REMOTE'
              echo "== whoami: $(id)"
              echo "== sudo:"; sudo -n -l 2>&1 | sed -n 1,15p
              echo "== helper: $(test -x /usr/local/sbin/finikfix-ops && echo установлен || echo НЕ установлен)"
              echo "== current: $(readlink -f /opt/finikfix/current)  sha: $(cat /opt/finikfix/current/.release-sha 2>/dev/null)"
              echo "== releases:"; ls -1t /opt/finikfix/releases | head -6
              echo "== /opt/finikfix:"; ls -la /opt/finikfix | head -20
              echo "== shared:"; ls -la /opt/finikfix/shared 2>&1 | head -12
              echo "== data (может быть недоступно deploy):"; ls -la /opt/finikfix/shared/data 2>&1 | head -12
              echo "== сервис: $(systemctl is-active finikfix) / nginx: $(systemctl is-active nginx)"
              echo "== nginx server_name/listen/блок lead:"; grep -rhnE "server_name|listen|location = /api/lead|ssl_certificate " /etc/nginx/sites-enabled/ 2>&1 | head -20
              echo "== letsencrypt: $(ls /etc/letsencrypt/live 2>&1 | tr '\n' ' ')"
              echo "== node: $(node -v)"; echo "== порты:"; ss -ltn | awk 'NR==1||/:(80|443|3000|22) /'
          REMOTE
              ;;
            net)
              # Сетевая доступность с сервера (без токена): DNS, TCP/TLS и HTTP-ответ Telegram API, MAX API и контрольных узлов.
              ssh -T finikfix 'bash -s' <<'REMOTE'
          for h in api.telegram.org platform-api2.max.ru platform-api.max.ru dev.max.ru api.github.com; do
            echo "== $h"; echo "dns: $(getent ahosts $h | awk '{print $1}' | sort -u | tr '\n' ' ')"
            curl -sS -m 10 -o /dev/null -w "https: code=%{http_code} connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s\n" "https://$h/" 2>&1 | tail -1
          done
          echo "== порт 443 api.telegram.org: $(timeout 6 bash -c 'echo > /dev/tcp/api.telegram.org/443' 2>&1 && echo открыт || echo закрыт-или-таймаут)"
          echo "== исходящий IP: $(curl -sS -m 8 https://api.ipify.org 2>&1)"
          REMOTE
              ;;
            max-tls)
              ssh -T finikfix 'bash -s' <<'REMOTE'
          H=platform-api2.max.ru
          echo "== с VPS: цепочка $H"
          echo | openssl s_client -connect $H:443 -servername $H -showcerts 2>/dev/null | awk '/BEGIN CERTIFICATE/{n++} n{print > ("/tmp/ffc" n ".pem")}'
          for f in /tmp/ffc*.pem; do echo "-- $f"; openssl x509 -in $f -noout -subject -issuer -fingerprint -sha256 2>&1; rm -f $f; done
          echo "== проверка на VPS: $(echo | openssl s_client -connect $H:443 -servername $H 2>&1 | grep 'Verify return code')"
          echo "== Node на VPS: $(node -e 'fetch("https://platform-api2.max.ru/me").then(r=>console.log("HTTP",r.status)).catch(e=>console.log("ошибка",e.cause&&e.cause.code))')"
          REMOTE
              ;;
            logs) ssh -T finikfix "sudo -n /usr/bin/journalctl -u finikfix -n 80 --no-pager" | sed -E 's/[0-9]{6,12}:[A-Za-z0-9_-]{30,}/***TOKEN***/g' ;;
            status) need_helper; ops status ;;
            backup) need_helper; ops backup ;;
            import-dry) need_helper; ops import-portfolio dry; ops import-reviews dry ;;
            import-commit)
              need_helper; set -e
              ops backup
              ops import-portfolio commit; ops import-reviews commit
              echo "== повторный импорт (идемпотентность):"; ops import-portfolio commit; ops import-reviews commit
              ops verify-data ;;
            max-setup)
              need_helper; set -e
              [ -n "$MAX_BOT_TOKEN" ] || { echo "::error::В GitHub Secrets не задан MAX_BOT_TOKEN"; exit 1; }
              [ -n "$MAX_RECIPIENT_USER_IDS" ] || { echo "::error::В GitHub Secrets не задан MAX_RECIPIENT_USER_IDS (два MAX user_id через запятую, после max-discover и вашего подтверждения)"; exit 1; }
              printf '%s' "$MAX_BOT_TOKEN" | ssh -T finikfix "sudo -n $H set-secret MAX_BOT_TOKEN"
              ops set-env MAX_RECIPIENT_USER_IDS "$MAX_RECIPIENT_USER_IDS"
              ops set-env MAX_API_BASE https://platform-api2.max.ru
              ops gen-salt
              ops max-check   # токен проверяется с самого VPS
              ops max-status ;;
            max-test) need_helper; ops max-test ;;
            max-discover-vps) need_helper; ops max-discover ;;
            clear-telegram)
              need_helper
              ops max-check || { echo "::error::MAX не проверен: Telegram-настройки не удаляю"; exit 1; }
              for k in TG_BOT_TOKEN TG_CHAT_ID TG_API_BASE; do ops unset-env $k; done
              ssh -T finikfix "sudo -n /usr/bin/systemctl restart finikfix" ;;
            enable-reviews)
              need_helper
              restart() { ssh -T finikfix "sudo -n /usr/bin/systemctl restart finikfix"; sleep 4; }
              rollback() { echo "::error::Проверка не прошла, откатываю REVIEWS_FORM=0"; ops set-env REVIEWS_FORM 0; restart; exit 1; }
              ops gen-salt && ops set-env REVIEWS_FORM 1 && restart || rollback
              [ "$(curl -fsS -m 15 "$SITE/api/config" | jq -r .reviews)" = "true" ] || rollback
              [ "$(post /api/reviews '{}' | tail -1)" = "HTTP 400" ] || rollback
              echo "отзывы включены: форма принимает и отклоняет невалидные запросы" ;;
            enable-leads)
              need_helper
              restart() { ssh -T finikfix "sudo -n /usr/bin/systemctl restart finikfix"; sleep 4; }
              # Без реальной отправки обоим получателям MAX приём не включается.
              ops max-check || { echo "::error::MAX не проверен, формы не включены"; exit 1; }
              ops max-test || { echo "::error::Тестовое сообщение MAX не доставлено, формы не включены"; exit 1; }
              rollback() { echo "::error::Проверка не прошла, выключаю приём заявок (LEADS_ENABLED=0)"; ops set-env LEADS_ENABLED 0; restart; exit 1; }
              ops set-env LEADS_ENABLED 1 || rollback
              ops nginx-lead open || rollback
              restart
              [ "$(curl -fsS -m 15 "$SITE/api/config" | jq -r .leads)" = "true" ] || rollback
              [ "$(post /api/lead '{}' | tail -1)" = "HTTP 400" ] || rollback
              [ "$(post /api/lead '{"name":"Тест","phone":"+79011112233","consent":false}' | tail -1)" = "HTTP 400" ] || rollback
              echo "приём заявок включён: невалидные запросы отклоняются (400)" ;;
            test-lead)
              post /api/lead '{"name":"ТЕСТ FinikFix (проверка)","phone":"+79990000000","comment":"Тестовая заявка от проверки доставки. Перезванивать не нужно.","consent":true,"page":"/","calc":{"device":"PlayStation","service":"Замена HDMI-порта","range":"от 2 500 ₽"}}'
              sleep 6; have_helper && ops leads-status ;;
            enable-admin)
              need_helper
              restart() { ssh -T finikfix "sudo -n /usr/bin/systemctl restart finikfix"; sleep 4; }
              ops set-env ADMIN_ENABLED 1
              ops nginx-admin open
              restart
              echo "GET /admin/ -> $(curl -s -m 15 -o /dev/null -w '%{http_code}' "$SITE/admin/")"
              echo "GET /admin/api/works без входа -> $(curl -s -m 15 -o /dev/null -w '%{http_code}' "$SITE/admin/api/works")" ;;
            verify)
              have_helper && { ops status; ops verify-data; } || echo "(помощник не установлен: серверная часть пропущена, проверяю публичную)"
              curl -fsS -m 20 "$SITE/api/portfolio" | jq '{works: (.works|length), photos: ([.works[].photos|length]|add)}'
              n=0; bad=0
              for u in $(curl -fsS -m 20 "$SITE/api/portfolio" | jq -r '.works[].photos[].src'); do
                n=$((n+1)); r=$(curl -s -m 25 -o /dev/null -w '%{http_code} %{size_download}B %{time_total}s' "$SITE$u") || r="curl-ошибка $r"
                case "$r" in 200*) ;; *) bad=$((bad+1)); echo "ПРОБЛЕМА: $u -> $r";; esac
                [ "$n" -le 3 ] && echo "пример: $u -> $r"
              done
              echo "фото проверено: $n, проблем: $bad"
              curl -fsS -m 20 "$SITE/api/reviews" | jq '{avito: (.avito|length), site: .siteCount, stats: .avitoStats}' ;;
          esac

      - name: Удаление ключа
        if: always()
        run: rm -f ~/.ssh/finikfix_key ~/.ssh/known_hosts ~/.ssh/config
