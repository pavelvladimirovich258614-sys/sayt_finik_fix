name: Deploy FinikFix

# Запуск: Actions → Deploy FinikFix → Run workflow, либо push в release/production.
# Автоматический деплой каждого коммита намеренно НЕ включён (см. deploy/VPS.md).
on:
  # Контролируемый запуск без workflow_dispatch: push в ветку release/production (создаётся вручную и только из коммита,
  # уже находящегося в claude/epic-hypatia-mxxztu; проверка ниже). Остальные ветки и коммиты ничего не выкладывают.
  push:
    branches: [release/production]
  workflow_dispatch:
    inputs:
      action:
        description: "deploy — выложить выбранную ветку; rollback — вернуться на предыдущий релиз"
        type: choice
        options: [deploy, rollback]
        default: deploy

permissions:
  contents: read

# Два деплоя одновременно не запускаются (на сервере есть ещё и flock).
concurrency:
  group: finikfix-deploy
  cancel-in-progress: false

env:
  FINIKFIX_HOST: 194.34.239.218
  FINIKFIX_USER: deploy

jobs:
  test:
    if: ${{ inputs.action != 'rollback' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: npm test

  deploy:
    needs: [test]
    # rollback не требует тестов: job test пропускается, а deploy всё равно запускается
    if: ${{ !cancelled() && !failure() && (github.ref == 'refs/heads/claude/epic-hypatia-mxxztu' || github.ref == 'refs/heads/release/production') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Релиз только из коммита, уже находящегося в рабочей ветке
        run: |
          git fetch -q origin claude/epic-hypatia-mxxztu
          git merge-base --is-ancestor "$GITHUB_SHA" origin/claude/epic-hypatia-mxxztu || { echo "::error::Коммит не входит в claude/epic-hypatia-mxxztu: деплой отменён"; exit 1; }

      - name: SSH-ключ и проверка отпечатка сервера
        env:
          SSH_KEY: ${{ secrets.FINIKFIX_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.FINIKFIX_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "$SSH_KEY" ] || { echo "::error::Не задан секрет FINIKFIX_SSH_KEY"; exit 1; }
          [ -n "$KNOWN_HOSTS" ] || { echo "::error::Не задан секрет FINIKFIX_KNOWN_HOSTS (строка host key сервера)"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/finikfix_key
          chmod 600 ~/.ssh/finikfix_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host finikfix
            HostName ${FINIKFIX_HOST}
            User ${FINIKFIX_USER}
            IdentityFile ~/.ssh/finikfix_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 15
          EOF

      - name: Загрузка релиза
        if: ${{ inputs.action != 'rollback' }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "Деплой коммита $SHA ($GITHUB_REF_NAME)"
          git archive --format=tar.gz -o /tmp/release.tar.gz HEAD
          ssh -T finikfix "cat > /opt/finikfix/incoming/rel-${SHA}.tar.gz.part && mv /opt/finikfix/incoming/rel-${SHA}.tar.gz.part /opt/finikfix/incoming/rel-${SHA}.tar.gz" < /tmp/release.tar.gz

      - name: Выкладка (сборка, проверка, переключение, откат при ошибке)
        env:
          ACTION: ${{ inputs.action || 'deploy' }}
        run: |
          set -euo pipefail
          ssh -T finikfix "cat > /opt/finikfix/incoming/remote-deploy.sh" < deploy/remote-deploy.sh
          if [ "$ACTION" = "rollback" ]; then
            ssh -T finikfix "bash /opt/finikfix/incoming/remote-deploy.sh rollback"
          else
            ssh -T finikfix "bash /opt/finikfix/incoming/remote-deploy.sh deploy $(git rev-parse HEAD)"
          fi

      - name: Проверка снаружи (HTTPS)
        env:
          SITE: https://finikfix.ru
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if curl -fsS -m 15 "$SITE/" -o /tmp/index.html; then break; fi; sleep 5
          done
          grep -q "hc-grid" /tmp/index.html || { echo "::error::На главной нет блока Hero"; exit 1; }
          grep -q 'href="tel:+79016624589"' /tmp/index.html || { echo "::error::На главной нет ссылки tel:"; exit 1; }
          grep -q 'slide-02-xbox.webp' /tmp/index.html || { echo "::error::На главной нет слайда Xbox"; exit 1; }
          grep -q 'slides-hq/slide-01-playstation.webp' /tmp/index.html || { echo "::error::На главной нет HD-слайдов (srcset)"; exit 1; }
          for n in 01-playstation 02-xbox 03-nintendo 04-pc 05-laptop 06-gamepads; do
            curl -fsS -m 20 -o /dev/null "$SITE/assets/img/slides-hq/slide-$n.webp" || { echo "::error::HD-файл slide-$n недоступен"; exit 1; }
          done
          # Форма обратного звонка штатная и скрыта, пока не включена (LEADS_ENABLED): допускается только окно #cb-form и скрытые кнопки.
          ! grep -qiE 'id="lead"|оставьте заявку|href="#request"' /tmp/index.html || { echo "::error::На главной остались следы старой формы заявки"; exit 1; }
          [ "$(grep -o '<form' /tmp/index.html | wc -l)" = "1" ] && grep -q '<form id="cb-form"' /tmp/index.html || { echo "::error::На главной должна быть только форма обратного звонка #cb-form"; exit 1; }
          ! grep -oE '<button[^>]*data-cb[ >][^>]*>' /tmp/index.html | grep -qv 'hidden' || { echo "::error::Кнопка заявки видна при выключенном приёме"; exit 1; }
          for p in privacy consent cookies terms mailing portfolio ceny kontakty; do
            curl -fsS -m 15 -o /dev/null "$SITE/$p/" || { echo "::error::Страница /$p/ недоступна"; exit 1; }
          done
          curl -fsS -m 15 -o /dev/null "$SITE/assets/fonts/unbounded-cyr.woff2"
          curl -fsS -m 15 -o /dev/null "$SITE/assets/img/master.webp"
          # HTTP должен перенаправлять на HTTPS
          loc="$(curl -s -m 15 -o /dev/null -w '%{http_code} %{redirect_url}' "http://finikfix.ru/")"
          case "$loc" in 301*https://finikfix.ru/*|308*https://finikfix.ru/*) ;; *) echo "::error::HTTP не перенаправляет на HTTPS: $loc"; exit 1;; esac
          # API: публичные ответы и корректная реакция на невалидные запросы (без создания записей)
          cfg="$(curl -fsS -m 15 "$SITE/api/config")"
          echo "$cfg" | jq -e 'has("leads") and has("reviews")' >/dev/null || { echo "::error::/api/config вернул неожиданный ответ"; exit 1; }
          curl -fsS -m 15 "$SITE/api/portfolio" | jq -e '.ok == true' >/dev/null || { echo "::error::/api/portfolio недоступен"; exit 1; }
          curl -fsS -m 15 "$SITE/api/reviews" | jq -e '.ok == true and .avitoStats.count == 62' >/dev/null || { echo "::error::/api/reviews недоступен или нет статистики Авито"; exit 1; }
          post() { curl -s -m 15 -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H "Origin: $SITE" -d "$2" "$SITE$1"; }
          if [ "$(echo "$cfg" | jq -r .leads)" = "true" ]; then want_lead=400; else want_lead=503; fi
          if [ "$(echo "$cfg" | jq -r .reviews)" = "true" ]; then want_rev=400; else want_rev=503; fi
          c="$(post /api/lead '{}')"; [ "$c" = "$want_lead" ] || { echo "::error::POST /api/lead с пустым телом: ожидалось $want_lead, получено $c"; exit 1; }
          c="$(post /api/lead '{"name":"Тест","phone":"+79011112233","consent":false}')"; [ "$c" = "$want_lead" ] || { echo "::error::/api/lead без согласия: ожидалось $want_lead, получено $c"; exit 1; }
          c="$(post /api/reviews '{}')"; [ "$c" = "$want_rev" ] || { echo "::error::POST /api/reviews с пустым телом: ожидалось $want_rev, получено $c"; exit 1; }
          c="$(curl -s -m 15 -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$SITE/api/lead")"; [ "$c" = "403" ] || [ "$c" = "503" ] || { echo "::error::/api/lead без Origin должен отклоняться (403/503), получено $c"; exit 1; }
          echo "OK: HTTPS, редирект HTTP→HTTPS, страницы, API (leads=$(echo "$cfg" | jq -r .leads), reviews=$(echo "$cfg" | jq -r .reviews))"

      - name: Удаление ключа
        if: always()
        run: rm -f ~/.ssh/finikfix_key ~/.ssh/known_hosts ~/.ssh/config /tmp/release.tar.gz
